<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Dipakai src/receipt/receipt.js (FONTCONFIG_FILE): font struk ikut di repo supaya
     teks gambar tetap muncul walau server tidak punya font sistem. Font sistem tetap dibaca. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <cachedir>/tmp/kelola-fontconfig</cachedir>
</fontconfig>
